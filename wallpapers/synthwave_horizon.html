<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Retro Synthwave Wireframe Horizon</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body, html { width: 100%; height: 100%; overflow: hidden; background: #07020d; }
    canvas { display: block; width: 100vw; height: 100vh; }
  </style>
</head>
<body>
  <canvas id="canvas"></canvas>
  <script>
    const canvas = document.getElementById("canvas");
    const ctx = canvas.getContext("2d");

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    window.addEventListener("resize", resize);
    resize();

    let offset = 0;
    const stars = Array.from({ length: 120 }, () => ({
      x: Math.random(),
      y: Math.random() * 0.5,
      size: Math.random() * 1.5 + 0.5,
      alpha: Math.random() * 0.8 + 0.2
    }));

    function draw() {
      // 1. Sky Gradient
      const skyGrad = ctx.createLinearGradient(0, 0, 0, height * 0.55);
      skyGrad.addColorStop(0, "#080014");
      skyGrad.addColorStop(0.5, "#1d0835");
      skyGrad.addColorStop(1, "#4a1240");
      ctx.fillStyle = skyGrad;
      ctx.fillRect(0, 0, width, height * 0.55);

      // 2. Stars
      stars.forEach(s => {
        ctx.fillStyle = `rgba(255, 255, 255, ${s.alpha * (0.8 + 0.2 * Math.sin(offset * 2 + s.x * 10))})`;
        ctx.fillRect(s.x * width, s.y * height, s.size, s.size);
      });

      // 3. Neon Synthwave Sun
      const sunY = height * 0.45;
      const sunRadius = Math.min(width, height) * 0.16;
      const sunGrad = ctx.createLinearGradient(0, sunY - sunRadius, 0, sunY + sunRadius);
      sunGrad.addColorStop(0, "#ffe853");
      sunGrad.addColorStop(0.5, "#ff3b77");
      sunGrad.addColorStop(1, "#7b1fa2");

      ctx.save();
      ctx.beginPath();
      ctx.arc(width / 2, sunY, sunRadius, 0, Math.PI * 2);
      ctx.fillStyle = sunGrad;
      ctx.shadowColor = "#ff3b77";
      ctx.shadowBlur = 40;
      ctx.fill();

      // Horizontal blinds / slice lines on the lower half of the sun
      ctx.shadowBlur = 0;
      for (let i = 0; i < 7; i++) {
        const sliceY = sunY + (i / 7) * sunRadius;
        const sliceHeight = 2 + i * 1.6;
        ctx.fillStyle = "#1d0835";
        ctx.fillRect(width / 2 - sunRadius, sliceY, sunRadius * 2, sliceHeight);
      }
      ctx.restore();

      // 4. Ground Gradient (Horizon to bottom)
      const groundY = height * 0.55;
      const groundGrad = ctx.createLinearGradient(0, groundY, 0, height);
      groundGrad.addColorStop(0, "#100220");
      groundGrad.addColorStop(0.4, "#0b0118");
      groundGrad.addColorStop(1, "#030008");
      ctx.fillStyle = groundGrad;
      ctx.fillRect(0, groundY, width, height - groundY);

      // 5. Wireframe Grid with Perspective
      offset = (offset + 0.015) % 1;
      const vanishingX = width / 2;
      const vanishingY = groundY;

      ctx.save();
      ctx.lineWidth = 1.2;

      // Moving Horizontal Perspective Lines
      const numHoriz = 22;
      for (let i = 0; i < numHoriz; i++) {
        // Perspective distribution: geometric curve
        const progress = Math.pow((i + offset) / numHoriz, 3.2);
        const y = vanishingY + progress * (height - vanishingY);
        const alpha = Math.min(1, progress * 1.8);

        ctx.strokeStyle = `rgba(0, 229, 255, ${alpha * 0.85})`;
        ctx.shadowColor = "#00e5ff";
        ctx.shadowBlur = progress * 12;
        ctx.beginPath();
        ctx.moveTo(0, y);
        ctx.lineTo(width, y);
        ctx.stroke();
      }

      // Radiating Vertical Lines converging to vanishing point
      const numVert = 36;
      for (let i = -numVert; i <= numVert; i++) {
        const xBottom = vanishingX + i * (width / 14);
        ctx.strokeStyle = "rgba(224, 64, 251, 0.75)";
        ctx.shadowColor = "#e040fb";
        ctx.shadowBlur = 8;
        ctx.beginPath();
        ctx.moveTo(vanishingX, vanishingY);
        ctx.lineTo(xBottom, height);
        ctx.stroke();
      }
      ctx.restore();

      // 6. Horizon Glow Beam
      ctx.save();
      const glowGrad = ctx.createLinearGradient(0, vanishingY - 6, 0, vanishingY + 6);
      glowGrad.addColorStop(0, "rgba(255, 64, 129, 0)");
      glowGrad.addColorStop(0.5, "rgba(255, 64, 129, 0.9)");
      glowGrad.addColorStop(1, "rgba(0, 229, 255, 0)");
      ctx.fillStyle = glowGrad;
      ctx.fillRect(0, vanishingY - 6, width, 12);
      ctx.restore();

      requestAnimationFrame(draw);
    }
    requestAnimationFrame(draw);
  </script>
</body>
</html>
